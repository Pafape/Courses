<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mes Courses</title>
  <style>
    :root {
      --primary: #1d4ed8; --primary-soft: #eff6ff; --urgent: #dc2626; --urgent-soft: #fef2f2;
      --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

    header {
      position: sticky; top: 0; z-index: 60; background: #fff; border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

    .btn-wake {
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer;
    }

    .filter-bar {
      position: sticky; top: 52px; z-index: 50; display: flex; gap: 8px; overflow-x: auto;
      padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--border);
    }
    .filter-chip {
      padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; white-space: nowrap;
      border: 1px solid var(--border); background: #fff; color: var(--text-muted); cursor: pointer;
    }
    .filter-chip.active { background: var(--text); color: #fff; border-color: var(--text); }

    .view { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
    .view.active { display: block; }

    .sub-tabs { display: flex; background: #e2e8f0; padding: 3px; border-radius: 12px; margin-bottom: 12px; }
    .sub-tab-btn {
      flex: 1; border: none; background: transparent; padding: 8px; font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); border-radius: 9px; cursor: pointer; text-align: center;
    }
    .sub-tab-btn.active { background: #fff; color: var(--text); }
    .sub-tab-btn.urgent-tab.active { color: var(--urgent); font-weight: 700; }

    .loyalty-banner {
      background: #1e293b; color: #fff; border-radius: 12px; padding: 10px 14px; display: flex;
      justify-content: space-between; align-items: center; margin-bottom: 12px; cursor: pointer;
    }

    .tab-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; flex-wrap: wrap; gap: 8px; }
    .btn-action-pill {
      background: var(--primary-soft); color: var(--primary); border: 1px solid #bfdbfe;
      padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem;
    }
    .btn-del-all {
      background: var(--urgent-soft); color: var(--urgent); border: 1px solid #fca5a5;
      padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.8rem;
    }

    .aisle-header {
      font-size: 0.82rem; font-weight: 700; text-transform: uppercase; color: var(--primary);
      background: var(--primary-soft); padding: 8px 12px; border-radius: 8px; margin: 16px 0 8px;
      display: flex; justify-content: space-between; border-left: 4px solid var(--primary);
    }
    .aisle-count { font-size: 0.75rem; background: #dbeafe; color: var(--primary); padding: 2px 7px; border-radius: 10px; }

    .card-item, .cat-item {
      background: #fff; border-radius: 12px; border: 1px solid var(--border); padding: 10px 12px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
    }
    .card-item.urgent { border-left: 4px solid var(--urgent); background: var(--urgent-soft); }
    .btn-check {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid #cbd5e1; background: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .item-body { flex-grow: 1; min-width: 0; }
    .item-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 6px; margin-top: 2px; }
    .badge-store { background: #e2e8f0; font-size: 0.68rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
    .badge-urg { background: var(--urgent); color: #fff; font-size: 0.65rem; font-weight: 700; padding: 2px 5px; border-radius: 4px; }

    .qty-box { display: flex; align-items: center; gap: 6px; background: #f1f5f9; border-radius: 20px; padding: 3px 8px; flex-shrink: 0; }
    .qty-btn { border: none; background: transparent; font-size: 1.1rem; font-weight: 700; cursor: pointer; padding: 0 4px; }
    .qty-val { font-size: 0.85rem; font-weight: 700; min-width: 14px; text-align: center; }

    .sticky-search { position: sticky; top: 105px; z-index: 40; background: var(--bg); padding-bottom: 10px; }
    .search-wrap { position: relative; }
    .btn-mic-inside {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: none;
      background: transparent; font-size: 1.1rem; cursor: pointer;
    }

    .voice-banner {
      background: linear-gradient(135deg, #eff6ff, #dbeafe); border: 2px dashed #93c5fd;
      border-radius: 14px; padding: 14px; text-align: center; margin-bottom: 14px; cursor: pointer;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; }
    .btn-submit {
      width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px;
      border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 8px;
    }

    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #fff;
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.72rem; color: var(--text-muted); cursor: pointer; }
    .nav-btn.active { color: var(--primary); font-weight: 700; }

    .toast-undo {
      position: fixed; bottom: 70px; left: 16px; right: 16px; background: #1e293b; color: #fff;
      padding: 10px 14px; border-radius: 8px; display: none; justify-content: space-between; align-items: center; font-size: 0.85rem; z-index: 150;
    }
    .toast-undo button { background: var(--primary); color: #fff; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-box {
      background: #fff; width: 100%; max-width: 420px; border-radius: 14px; padding: 18px;
      max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content-scroll { overflow-y: auto; text-align: left; margin: 12px 0; padding-right: 4px; }
    
    .summary-store-card {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 12px;
    }
    .summary-store-title {
      font-weight: 700; color: var(--primary); font-size: 0.95rem; border-bottom: 1px solid var(--border);
      padding-bottom: 6px; margin-bottom: 8px; display: flex; justify-content: space-between;
    }
    .summary-item-row {
      display: flex; justify-content: space-between; align-items: center; font-size: 0.86rem; padding: 4px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🛒 Mes Courses</div>
    <div style="display:flex; gap:8px;">
      <button class="btn-wake" id="btnWake" onclick="window.toggleWakeLock()" title="Garder l'écran allumé">💡</button>
      <div style="font-size:0.75rem; background:#ecfdf5; color:#047857; padding:6px 10px; border-radius:20px; font-weight:600;">Foyer (1/5)</div>
    </div>
  </header>

  <div class="filter-bar" id="filterBar">
    <button class="filter-chip active" onclick="window.setStore('TOUS', this)">Tous</button>
    <button class="filter-chip" onclick="window.setStore('E.Leclerc', this)">E.Leclerc</button>
    <button class="filter-chip" onclick="window.setStore('Lidl', this)">Lidl</button>
    <button class="filter-chip" onclick="window.setStore('Grand Frais', this)">Grand Frais</button>
    <button class="filter-chip" onclick="window.setStore('dm-drogerie', this)">dm Allemagne</button>
    <button class="filter-chip" onclick="window.setStore('Autre magasin', this)">Autre magasin</button>
  </div>

  <!-- ONGLET 1 : COURSES -->
  <main id="view-courses" class="view active">
    <div id="loyaltyBanner" class="loyalty-banner" style="display:none;" onclick="window.openCard()">
      <span id="loyaltyBannerTitle">💳 Carte magasin</span>
      <span style="font-size:0.75rem; background:rgba(255,255,255,0.2); padding:4px 10px; border-radius:6px; font-weight:700;">Passer en caisse</span>
    </div>

    <div class="sub-tabs">
      <button class="sub-tab-btn active" id="tabAll" onclick="window.setCoursesTab('ALL')">Tout à acheter (<span id="countAll">0</span>)</button>
      <button class="sub-tab-btn urgent-tab" id="tabUrg" onclick="window.setCoursesTab('URGENT')">🔥 Urgences (<span id="countUrg">0</span>)</button>
    </div>

    <div class="tab-actions">
      <button class="btn-action-pill" id="btnSummaryTitle" onclick="window.openSummaryModal()">📋 Synthèse des courses</button>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="listTotalText" style="color:var(--text-muted); font-size:0.8rem; margin-right:4px;">0 article</span>
        <button style="background:none; border:none; color:var(--primary); font-weight:600; cursor:pointer;" onclick="window.restoreChecked()">Rétablir</button>
        <button class="btn-del-all" onclick="window.clearAllCourses()">🗑️ Tout supprimer</button>
      </div>
    </div>

    <div id="coursesContainer"></div>
  </main>

  <!-- ONGLET 2 : CATALOGUE -->
  <section id="view-catalog" class="view">
    <div class="sticky-search">
      <div class="search-wrap">
        <input type="text" id="catSearch" class="form-control" placeholder="🔍 Rechercher dans le catalogue..." oninput="window.renderCatalog()">
        <button class="btn-mic-inside" onclick="window.voiceSearch()">🎙️</button>
      </div>
    </div>
    <div id="catalogContainer"></div>
  </section>

  <!-- ONGLET 3 : AJOUTER -->
  <section id="view-add" class="view">
    <h2 style="font-size:1.05rem; margin-bottom:12px;">Ajouter au catalogue</h2>
    <div class="voice-banner" id="voiceBanner" onclick="window.startVoiceAdd()">
      <div style="font-weight:700; color:var(--primary);">🎙️ Création vocale rapide</div>
      <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">Dis : « Pommes bio à Grand Frais urgent » ou « Lait à Leclerc »</div>
    </div>

    <form onsubmit="window.saveProduct(event)">
      <div class="form-group">
        <label>Nom de l'article *</label>
        <div style="position:relative;">
          <input type="text" id="pName" class="form-control" placeholder="Ex: Café arabica, Poulet..." required>
          <button type="button" class="btn-mic-inside" onclick="window.dictateField('pName')">🎙️</button>
        </div>
      </div>
      <div class="form-group">
        <label>Magasin assigné *</label>
        <select id="pStore" class="form-control">
          <option value="E.Leclerc">E.Leclerc</option>
          <option value="Lidl">Lidl</option>
          <option value="Grand Frais">Grand Frais</option>
          <option value="dm-drogerie">dm-drogerie (dm Allemagne)</option>
          <option value="Autre magasin">Autre magasin</option>
        </select>
      </div>
      <div class="form-group">
        <label>Contenance / Format</label>
        <div style="position:relative;">
          <input type="text" id="pVariant" class="form-control" placeholder="Ex: 500g, Pack x4, 1.5L...">
          <button type="button" class="btn-mic-inside" onclick="window.dictateField('pVariant')">🎙️</button>
        </div>
      </div>
      <div class="form-group">
        <label>Rayon du magasin *</label>
        <select id="pAisle" class="form-control" onchange="window.checkNewAisle(this)">
          <option value="fresh">🍎 Fruits, Légumes & Frais</option>
          <option value="dairy">🧀 Crèmerie & Fromages</option>
          <option value="grocery">🍝 Épicerie</option>
          <option value="drink">🥤 Boissons</option>
          <option value="home">🧻 Entretien & Maison</option>
          <option value="hygiene">🧴 Hygiène & Beauté</option>
          <option value="__NEW__">➕ Créer un nouveau rayon personnalisé...</option>
        </select>
      </div>
      <div class="form-group" id="newAisleGroup" style="display:none;">
        <label style="color:var(--primary);">Nom du nouveau rayon :</label>
        <input type="text" id="pCustomAisle" class="form-control" placeholder="Ex: Boucherie, Poissonnerie, Animalerie...">
      </div>
      <div class="form-group" style="display:flex; gap:16px; margin:10px 0;">
        <label style="display:flex; align-items:center; gap:6px; color:var(--urgent); font-weight:600;"><input type="checkbox" id="pUrg"> Urgent 🔥</label>
        <label style="display:flex; align-items:center; gap:6px; color:#b45309; font-weight:600;"><input type="checkbox" id="pFav"> Favori ⭐</label>
      </div>
      <button type="submit" class="btn-submit">Valider et enregistrer au catalogue</button>
    </form>
  </section>

  <!-- ONGLET 4 : CARTES -->
  <section id="view-cards" class="view">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="font-size:1.05rem;">Cartes de fidélité</h2>
      <button style="background:none; border:none; color:var(--primary); font-weight:600; cursor:pointer;" onclick="document.getElementById('cardUpload').click()">+ Ajouter</button>
      <input type="file" id="cardUpload" accept="image/*" style="display:none;" onchange="window.uploadCard(event)">
    </div>
    <div id="cardsContainer"></div>
  </section>

  <nav>
    <button class="nav-btn active" onclick="window.switchTab('view-courses', this)"><span>📋</span><span>Courses</span></button>
    <button class="nav-btn" onclick="window.switchTab('view-catalog', this)"><span>📦</span><span>Catalogue</span></button>
    <button class="nav-btn" onclick="window.switchTab('view-add', this)"><span>➕</span><span>Ajouter</span></button>
    <button class="nav-btn" onclick="window.switchTab('view-cards', this)"><span>💳</span><span>Fidélité</span></button>
  </nav>

  <div id="undoToast" class="toast-undo">
    <span id="undoText">Article coché</span>
    <button onclick="window.undoCheck()">Annuler</button>
  </div>

  <div class="modal" id="cardModal">
    <div class="modal-box">
      <h3 id="modalCardTitle" style="margin-bottom:10px;">Carte</h3>
      <img id="modalCardImg" src="" style="width:100%; max-height:220px; object-fit:contain; margin-bottom:12px;">
      <button class="btn-submit" onclick="document.getElementById('cardModal').classList.remove('active')">Fermer</button>
    </div>
  </div>

  <!-- MODALE SYNTHÈSE DES COURSES -->
  <div class="modal" id="summaryModal">
    <div class="modal-box">
      <h3 style="font-size:1.1rem; color:var(--text); display:flex; align-items:center; justify-content:space-between;">
        <span id="summaryModalHeader">📋 Synthèse des courses</span>
        <button style="background:none; border:none; font-size:1.2rem; cursor:pointer;" onclick="window.closeSummaryModal()">✕</button>
      </h3>
      <p style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;" id="summaryModalSub">Articles à acheter</p>
      
      <div class="modal-content-scroll" id="summaryContainer"></div>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn-submit" style="background:#0f172a; margin-top:0;" onclick="window.copySummaryText()">📋 Copier le texte</button>
        <button class="btn-submit" style="background:#e2e8f0; color:var(--text); margin-top:0;" onclick="window.closeSummaryModal()">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    window.AISLES = [
      { id: 'fresh', name: '🍎 Fruits, Légumes & Frais', priority: 1 },
      { id: 'dairy', name: '🧀 Crèmerie & Fromages', priority: 2 },
      { id: 'grocery', name: '🍝 Épicerie', priority: 3 },
      { id: 'drink', name: '🥤 Boissons', priority: 4 },
      { id: 'home', name: '🧻 Entretien & Maison', priority: 5 },
      { id: 'hygiene', name: '🧴 Hygiène & Beauté', priority: 6 }
    ];

    const STORAGE_KEY = 'courses_v21_safari';

    const defaultProds = [
      // Grand Frais

      // E.Leclerc

      { id: 8, name: "Biscuits Goûters REM Chocolat", store: "E.Leclerc", variant: "3x125g", cat: "grocery", urg: false, inList: true, qty: 1, chk: false },
      { id: 9, name: "Spéculoos Pocket P'tit Déli", store: "E.Leclerc", variant: "168g", cat: "grocery", urg: false, inList: false, qty: 0, chk: false },

      // Lidl
      { id: 27, name: "Pain de mie complet", store: "Lidl", variant: "500g", cat: "grocery", urg: false, inList: true, qty: 1, chk: false },
      { id: 28, name: "Fromage râpé Emmental", store: "Lidl", variant: "200g", cat: "dairy", urg: false, inList: false, qty: 0, chk: false },

      // Autre magasin
      { id: 29, name: "Baguette tradition artisanale", store: "Autre magasin", variant: "Pièce", cat: "grocery", urg: true, inList: true, qty: 2, chk: false }
    ];

    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      window.prods = stored ? JSON.parse(stored) : defaultProds;
    } catch(e) {
      window.prods = defaultProds;
    }

    window.cards = [
      { id: 1, store: "E.Leclerc", img: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=LECLERC" },
      { id: 2, store: "Lidl", img: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=LIDL" },
      { id: 3, store: "Grand Frais", img: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=GRANDFRAIS" },
      { id: 4, store: "dm-drogerie", img: "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PAYBACK" }
    ];

    window.curStore = 'TOUS';
    window.curSub = 'ALL';
    window.lastItem = null;

    window.saveState = function() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(window.prods));
      } catch(e) {}
    };

    window.getAisleName = function(catId) {
      const f = window.AISLES.find(a => a.id === catId);
      return f ? f.name : '📦 ' + catId;
    };

    window.switchTab = function(id, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const target = document.getElementById(id);
      if (target) target.classList.add('active');
      if (btn) btn.classList.add('active');
      const bar = document.getElementById('filterBar');
      if (bar) bar.style.display = (id === 'view-courses' || id === 'view-catalog') ? 'flex' : 'none';
    };

    window.setStore = function(s, el) {
      window.curStore = s;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      if (el) el.classList.add('active');

      const b = document.getElementById('loyaltyBanner');
      if (b) {
        if (s !== 'TOUS' && window.cards.find(c => c.store.toLowerCase().includes(s.toLowerCase()))) {
          b.style.display = 'flex';
          const t = document.getElementById('loyaltyBannerTitle');
          if (t) t.innerText = '💳 Carte ' + s;
        } else {
          b.style.display = 'none';
        }
      }

      const summaryBtn = document.getElementById('btnSummaryTitle');
      if (summaryBtn) {
        summaryBtn.innerText = (s === 'TOUS') ? '📋 Synthèse globale' : `📋 Synthèse ${s}`;
      }

      window.renderCourses();
      window.renderCatalog();
    };

    window.setCoursesTab = function(t) {
      window.curSub = t;
      const tabAll = document.getElementById('tabAll');
      const tabUrg = document.getElementById('tabUrg');
      if (tabAll) tabAll.classList.toggle('active', t === 'ALL');
      if (tabUrg) tabUrg.classList.toggle('active', t === 'URGENT');
      window.renderCourses();
    };

    window.openCard = function() {
      const card = window.cards.find(c => c.store.toLowerCase().includes(window.curStore.toLowerCase()));
      if (card) {
        const title = document.getElementById('modalCardTitle');
        const img = document.getElementById('modalCardImg');
        const modal = document.getElementById('cardModal');
        if (title) title.innerText = 'Carte ' + card.store;
        if (img) img.src = card.img;
        if (modal) modal.classList.add('active');
      }
    };

    // Rendu Courses
    window.renderCourses = function() {
      const box = document.getElementById('coursesContainer');
      if (!box) return;
      box.innerHTML = '';

      let list = window.prods.filter(p => p.inList && p.qty > 0 && !p.chk);
      if (window.curStore !== 'TOUS') {
        list = list.filter(p => p.store === window.curStore);
      }

      const countAll = document.getElementById('countAll');
      const countUrg = document.getElementById('countUrg');
      if (countAll) countAll.innerText = list.length;
      if (countUrg) countUrg.innerText = list.filter(p => p.urg).length;

      if (window.curSub === 'URGENT') list = list.filter(p => p.urg);
      
      const totalTxt = document.getElementById('listTotalText');
      if (totalTxt) totalTxt.innerText = list.length + ' article(s)';

      if (!list.length) {
        box.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;">Aucun produit à acheter pour ce magasin !</div>';
        return;
      }

      const grp = {};
      list.forEach(p => { (grp[p.cat] = grp[p.cat] || []).push(p); });

      const sortedCats = Object.keys(grp).sort((a, b) => {
        const pA = (window.AISLES.find(x => x.id === a) || {}).priority || 99;
        const pB = (window.AISLES.find(x => x.id === b) || {}).priority || 99;
        return pA - pB;
      });

      sortedCats.forEach(cat => {
        const title = document.createElement('div');
        title.className = 'aisle-header';
        title.innerHTML = `<span>${window.getAisleName(cat)}</span><span class="aisle-count">${grp[cat].length}</span>`;
        box.appendChild(title);

        grp[cat].forEach(p => {
          const row = document.createElement('div');
          row.className = 'card-item' + (p.urg ? ' urgent' : '');
          row.innerHTML = `
            <div class="btn-check" onclick="window.checkItem(${p.id})"></div>
            <div class="item-body">
              <div class="item-title">${p.name}</div>
              <div class="item-sub"><span class="badge-store">${p.store}</span><span>${p.variant || ''}</span>${p.urg ? '<span class="badge-urg">Urgent 🔥</span>' : ''}</div>
            </div>
            <div class="qty-box">
              <button class="qty-btn" onclick="window.addQty(${p.id}, -1)">-</button>
              <span class="qty-val">${p.qty}</span>
              <button class="qty-btn" onclick="window.addQty(${p.id}, 1)">+</button>
            </div>
          `;
          box.appendChild(row);
        });
      });
    };

    window.checkItem = function(id) {
      const p = window.prods.find(x => x.id === id);
      if (!p) return;
      p.chk = true;
      window.lastItem = p;
      window.saveState();
      window.renderCourses();
      const t = document.getElementById('undoToast');
      const uTxt = document.getElementById('undoText');
      if (uTxt) uTxt.innerText = `« ${p.name} » coché`;
      if (t) {
        t.style.display = 'flex';
        setTimeout(() => t.style.display = 'none', 4000);
      }
    };

    window.undoCheck = function() {
      if (window.lastItem) {
        window.lastItem.chk = false;
        window.lastItem = null;
        window.saveState();
        const t = document.getElementById('undoToast');
        if (t) t.style.display = 'none';
        window.renderCourses();
      }
    };

    window.addQty = function(id, d) {
      const p = window.prods.find(x => x.id === id);
      if (p) {
        p.qty += d;
        if (p.qty <= 0) { p.inList = false; p.qty = 0; p.chk = false; }
        window.saveState();
        window.renderCourses();
      }
    };

    window.restoreChecked = function() {
      window.prods.forEach(p => p.chk = false);
      window.saveState();
      window.renderCourses();
    };

    window.clearAllCourses = function() {
      const targetStore = window.curStore;
      const msg = (targetStore === 'TOUS') ? 
        "Vider entièrement votre liste de courses ?" : 
        `Supprimer tous les articles de courses pour ${targetStore} ?`;

      if (confirm(msg)) {
        window.prods.forEach(p => {
          if (targetStore === 'TOUS' || p.store === targetStore) {
            p.inList = false;
            p.qty = 0;
            p.chk = false;
          }
        });
        window.saveState();
        window.renderCourses();
      }
    };

    // Rendu Catalogue
    window.renderCatalog = function() {
      const box = document.getElementById('catalogContainer');
      if (!box) return;
      box.innerHTML = '';
      const searchEl = document.getElementById('catSearch');
      const q = (searchEl ? searchEl.value : '').toLowerCase();

      let list = window.prods;
      if (window.curStore !== 'TOUS') {
        list = list.filter(p => p.store === window.curStore);
      }
      if (q) list = list.filter(p => p.name.toLowerCase().includes(q) || p.variant.toLowerCase().includes(q));

      if (!list.length) {
        box.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;">Aucun produit trouvé dans le catalogue pour ce filtre.</div>';
        return;
      }

      const grp = {};
      list.forEach(p => { (grp[p.cat] = grp[p.cat] || []).push(p); });

      const sortedCats = Object.keys(grp).sort((a, b) => {
        const pA = (window.AISLES.find(x => x.id === a) || {}).priority || 99;
        const pB = (window.AISLES.find(x => x.id === b) || {}).priority || 99;
        return pA - pB;
      });

      sortedCats.forEach(cat => {
        const title = document.createElement('div');
        title.className = 'aisle-header';
        title.innerHTML = `<span>${window.getAisleName(cat)}</span><span class="aisle-count">${grp[cat].length}</span>`;
        box.appendChild(title);

        grp[cat].forEach(p => {
          const row = document.createElement('div');
          row.className = 'cat-item';
          row.innerHTML = `
            <div class="item-body">
              <div class="item-title">${p.name}</div>
              <div class="item-sub"><span class="badge-store">${p.store}</span><span>${p.variant || ''}</span>${p.urg ? '<span style="color:var(--urgent);font-weight:700;">• Urgent</span>' : ''}</div>
            </div>
            <button style="border:none;background:none;font-size:1.1rem;cursor:pointer;margin-right:8px;" onclick="window.toggleUrg(${p.id})">${p.urg ? '🔥' : '⚪'}</button>
            <div class="qty-box">
              <button class="qty-btn" onclick="window.catQty(${p.id}, -1)">-</button>
              <span class="qty-val">${p.inList && !p.chk ? p.qty : 0}</span>
              <button class="qty-btn" onclick="window.catQty(${p.id}, 1)">+</button>
            </div>
            <button style="border:none;background:none;font-size:1rem;margin-left:8px;cursor:pointer;" onclick="window.delProd(${p.id})">🗑️</button>
          `;
          box.appendChild(row);
        });
      });
    };

    window.toggleUrg = function(id) {
      const p = window.prods.find(x => x.id === id);
      if (p) {
        p.urg = !p.urg;
        window.saveState();
        window.renderCatalog();
        window.renderCourses();
      }
    };

    window.delProd = function(id) {
      const p = window.prods.find(x => x.id === id);
      if (p && confirm(`Supprimer définitivement « ${p.name} » du catalogue ?`)) {
        window.prods = window.prods.filter(x => x.id !== id);
        window.saveState();
        window.renderCatalog();
        window.renderCourses();
      }
    };

    window.catQty = function(id, d) {
      const p = window.prods.find(x => x.id === id);
      if (p) {
        if (!p.inList || p.chk) {
          p.inList = true;
          p.chk = false;
          p.qty = d > 0 ? 1 : 0;
        } else {
          p.qty += d;
        }
        if (p.qty <= 0) { p.inList = false; p.qty = 0; }
        window.saveState();
        window.renderCatalog();
        window.renderCourses();
      }
    };

    window.checkNewAisle = function(s) {
      const grp = document.getElementById('newAisleGroup');
      if (grp) grp.style.display = (s.value === '__NEW__') ? 'block' : 'none';
    };

    window.saveProduct = function(e) {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const store = document.getElementById('pStore').value;
      const variant = document.getElementById('pVariant').value.trim();
      let cat = document.getElementById('pAisle').value;

      if (cat === '__NEW__') {
        const custom = document.getElementById('pCustomAisle').value.trim();
        if (!custom) return alert("Indiquez le nom du rayon !");
        cat = 'custom_' + Date.now();
        window.AISLES.push({ id: cat, name: '📦 ' + custom, priority: window.AISLES.length + 1 });
        const opt = document.createElement('option');
        opt.value = cat; opt.innerText = '📦 ' + custom;
        document.getElementById('pAisle').prepend(opt);
      }

      window.prods.unshift({
        id: Date.now(), name, store, variant, cat,
        urg: document.getElementById('pUrg').checked, inList: false, qty: 0, chk: false
      });

      window.saveState();
      e.target.reset();
      const grp = document.getElementById('newAisleGroup');
      if (grp) grp.style.display = 'none';
      alert(`« ${name} » a été ajouté au catalogue sous le rayon « ${window.getAisleName(cat)} » !`);
      window.renderCatalog();
      window.switchTab('view-catalog', document.querySelectorAll('.nav-btn')[1]);
    };

    // Synthèse contextuelle par magasin
    window.openSummaryModal = function() {
      const container = document.getElementById('summaryContainer');
      if (!container) return;
      container.innerHTML = '';

      let toBuy = window.prods.filter(p => p.inList && p.qty > 0 && !p.chk);
      const targetStore = window.curStore;

      const header = document.getElementById('summaryModalHeader');
      const sub = document.getElementById('summaryModalSub');

      if (targetStore !== 'TOUS') {
        toBuy = toBuy.filter(p => p.store === targetStore);
        if (header) header.innerText = `📋 Synthèse ${targetStore}`;
        if (sub) sub.innerText = `Courses à effectuer chez ${targetStore}`;
      } else {
        if (header) header.innerText = `📋 Synthèse globale`;
        if (sub) sub.innerText = `Toutes les courses par magasin`;
      }

      const modal = document.getElementById('summaryModal');

      if (!toBuy.length) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#94a3b8;">Aucun produit à acheter ${targetStore === 'TOUS' ? 'actuellement' : 'chez ' + targetStore}.</div>`;
        if (modal) modal.classList.add('active');
        return;
      }

      const byStore = {};
      toBuy.forEach(p => {
        byStore[p.store] = byStore[p.store] || [];
        byStore[p.store].push(p);
      });

      Object.keys(byStore).sort().forEach(store => {
        const card = document.createElement('div');
        card.className = 'summary-store-card';
        
        let html = `
          <div class="summary-store-title">
            <span>🏪 ${store}</span>
            <span style="font-size:0.75rem; background:#e2e8f0; color:var(--text); padding:2px 8px; border-radius:10px;">${byStore[store].length} produit(s)</span>
          </div>
        `;

        byStore[store].forEach(p => {
          html += `
            <div class="summary-item-row">
              <div>
                <strong>${p.name}</strong> ${p.variant ? `<span style="color:var(--text-muted); font-size:0.78rem;">(${p.variant})</span>` : ''}
                ${p.urg ? '<span style="color:var(--urgent); font-size:0.75rem; font-weight:700;"> 🔥</span>' : ''}
              </div>
              <div style="font-weight:700; color:var(--primary); font-size:0.9rem; padding-left:8px;">x${p.qty}</div>
            </div>
          `;
        });

        card.innerHTML = html;
        container.appendChild(card);
      });

      if (modal) modal.classList.add('active');
    };

    window.closeSummaryModal = function() {
      const modal = document.getElementById('summaryModal');
      if (modal) modal.classList.remove('active');
    };

    window.copySummaryText = function() {
      let toBuy = window.prods.filter(p => p.inList && p.qty > 0 && !p.chk);
      const targetStore = window.curStore;

      if (targetStore !== 'TOUS') {
        toBuy = toBuy.filter(p => p.store === targetStore);
      }

      if (!toBuy.length) return alert("Rien à copier pour cette sélection !");

      const byStore = {};
      toBuy.forEach(p => {
        byStore[p.store] = byStore[p.store] || [];
        byStore[p.store].push(p);
      });

      let text = (targetStore === 'TOUS') ? 
        `🛒 SYNTHÈSE GLOBALE DES COURSES :\n\n` : 
        `🛒 SYNTHÈSE DES COURSES - ${targetStore.toUpperCase()} :\n\n`;

      Object.keys(byStore).sort().forEach(store => {
        text += `🏪 ${store.toUpperCase()} :\n`;
        byStore[store].forEach(p => {
          text += ` - ${p.name} ${p.variant ? `(${p.variant})` : ''} : x${p.qty}${p.urg ? ' [URGENT]' : ''}\n`;
        });
        text += "\n";
      });

      navigator.clipboard.writeText(text).then(() => {
        alert("✅ Synthèse copiée dans le presse-papiers !");
      }).catch(() => {
        alert(text);
      });
    };

    window.startVoiceAdd = function() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Reconnaissance vocale non disponible sur ce navigateur.");
      const r = new SR(); r.lang = 'fr-FR';
      r.onresult = (e) => {
        let txt = e.results[0][0].transcript.toLowerCase();
        let urg = txt.includes('urgent');
        let store = 'Autre magasin';
        if (txt.includes('leclerc')) store = 'E.Leclerc';
        else if (txt.includes('lidl')) store = 'Lidl';
        else if (txt.includes('grand frais')) store = 'Grand Frais';
        else if (txt.includes('dm')) store = 'dm-drogerie';
        txt = txt.replace(/urgent|à leclerc|à lidl|à grand frais|à dm/g, '').trim();
        document.getElementById('pName').value = txt.charAt(0).toUpperCase() + txt.slice(1);
        document.getElementById('pStore').value = store;
        document.getElementById('pUrg').checked = urg;
        alert("Compris : " + txt + " (" + store + ") !");
      };
      r.start();
    };

    window.dictateField = function(fieldId) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Reconnaissance vocale non disponible.");
      const r = new SR(); r.lang = 'fr-FR';
      r.onresult = (e) => { document.getElementById(fieldId).value = e.results[0][0].transcript; };
      r.start();
    };

    window.voiceSearch = function() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Reconnaissance vocale non disponible.");
      const r = new SR(); r.lang = 'fr-FR';
      r.onresult = (e) => {
        document.getElementById('catSearch').value = e.results[0][0].transcript;
        window.renderCatalog();
      };
      r.start();
    };

    window.toggleWakeLock = async function() {
      if ('wakeLock' in navigator) {
        try {
          if (!window.wLock) {
            window.wLock = await navigator.wakeLock.request('screen');
            document.getElementById('btnWake').style.background = '#fef08a';
          } else {
            await window.wLock.release();
            window.wLock = null;
            document.getElementById('btnWake').style.background = '#fff';
          }
        } catch(e) {}
      } else {
        alert("Fonction écran allumé non supportée sur ce navigateur.");
      }
    };

    window.uploadCard = function(e) {
      const f = e.target.files[0];
      if (f) {
        const r = new FileReader();
        r.onload = (ev) => {
          const s = prompt("Nom du magasin :", "E.Leclerc");
          if (s) {
            window.cards.push({ id: Date.now(), store: s, img: ev.target.result });
            window.renderCards();
          }
        };
        r.readAsDataURL(f);
      }
    };

    window.delCard = function(id) {
      window.cards = window.cards.filter(c => c.id !== id);
      window.renderCards();
    };

    window.renderCards = function() {
      const box = document.getElementById('cardsContainer');
      if (!box) return;
      box.innerHTML = '';
      window.cards.forEach(c => {
        const d = document.createElement('div');
        d.style.cssText = 'background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:12px;';
        d.innerHTML = `<div style="display:flex; justify-content:space-between; font-weight:700; margin-bottom:8px;">${c.store}<span style="color:var(--urgent); cursor:pointer;" onclick="window.delCard(${c.id})">Supprimer</span></div><img src="${c.img}" style="width:100%; max-height:160px; object-fit:contain;">`;
        box.appendChild(d);
      });
    };

    // Démarrage initial
    window.renderCourses();
    window.renderCatalog();
    window.renderCards();
  </script>
</body>
</html>
